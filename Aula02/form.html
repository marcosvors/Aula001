<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Escola Virtual</h1>
    <h3> Escola Virtual</h3>
<form>
    <fieldset>
        <legend> Dados Pessoais</legend>
        <label>Nome</label>
        <input type="text">
        <label>Data Nascimento</label>
        <input type="date">
        <label>Nome do pai</label>
        <input type="text">
        <label>Nome do mãe</label>
        <input type="text">
        <label>Telefone DDD:</label>
        <input type="text">
        <label>Tel:</label>
        <input type="text">
        <label>Ramal:</label>
        <input type="text">
    </fieldset>
    <fieldset>
        <legend>Informação da Matícula</legend>
        <label>Série:</label>
        <select>
            <option>Pré Escolar</option>
            <option>Ensino Médio</option>
        </select>
        <label>Turno:</label>
        <input type="radio" name="turno">Manhã
        <input type="radio" name="turno">Tarde
        <br>
        <label>Atividade Extracurriculares</label>
        <input type="checkbox">Informática
        <input type="checkbox">Música
        <input type="checkbox">Balet
        <input type="checkbox">Pintura
        <input type="checkbox">Judô
        <input type="checkbox">Futebol
    </fieldset>
    <fieldset>
        <input type="submit" value="Enviar Formulário">
        <input type="reset" value ="Limpar Campos">
    </fieldset>
</form>
</body>
</html>
